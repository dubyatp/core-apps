apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netmaker-ui
spec:
  parentRefs:
    - name: traefik
      sectionName: https
      kind: Gateway
  hostnames:
    - dashboard.netmaker.infra.dubyatp.xyz
  rules:
     - matches:
        - path:
            type: PathPrefix
            value: /
       backendRefs:
        - name: netmaker-ui
          port: 80