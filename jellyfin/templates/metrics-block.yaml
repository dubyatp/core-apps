{{- if and (.Values.jellyfin.metrics.enabled) (.Values.jellyfin.httpRoute.enabled) -}}
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-svc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: dummy-svc
  ports:
    - protocol: TCP
      port: 6767
      targetPort: 6767
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: block-metrics
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    {{- toYaml .Values.jellyfin.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.jellyfin.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
      backendRefs:
        - name: dummy-svc
          port: 6767
{{- end }}