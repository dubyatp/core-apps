apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whatismyip-ingress
spec:
  parentRefs:
    - name: traefik
      sectionName: https
      kind: Gateway
  hostnames:
    - whatismyip.dubyatp.xyz
  rules:
     - matches:
        - path:
            type: PathPrefix
            value: /
       backendRefs:
        - name: whatismyip-svc
          port: 8080
       filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: cloudflarewarp